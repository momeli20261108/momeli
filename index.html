
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#78977B">
<title>Momeli</title>
<style>
:root{--g:#78977B;--d:#405C45;--p:#E8F0E5;--cream:#FFFDF7;--text:#28352B}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
header{height:55px;position:fixed;z-index:10;top:0;left:0;right:0;background:#fffdf7ee;backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #e7ebe5}
.logo{font-size:23px;font-weight:800;color:var(--g);letter-spacing:1px}
.header-label{font-size:12px;color:#788579}
main{padding-top:55px;padding-bottom:85px;min-height:100vh}
.page{display:none;min-height:calc(100vh - 140px)}
.page.active{display:block}
#feedPage{height:calc(100dvh - 140px);overflow-y:auto;scroll-snap-type:y mandatory}
.post{height:calc(100dvh - 140px);min-height:480px;position:relative;scroll-snap-align:start;overflow:hidden;background:#dce5d9;color:white}
.post-media{width:100%;height:100%;object-fit:cover;display:block}
.post:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#0009);pointer-events:none}
.post-info{position:absolute;z-index:2;bottom:22px;left:17px;right:78px;text-shadow:0 1px 5px #0008}
.post-place{font-size:13px;font-weight:700;margin-bottom:8px}
.post-title{font-size:21px;font-weight:800;margin-bottom:8px}
.post-caption{font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.post-actions{position:absolute;right:13px;bottom:35px;z-index:3;display:flex;flex-direction:column;gap:19px;align-items:center}
.action-item{display:flex;flex-direction:column;align-items:center;gap:3px}
.action-btn{border:0;background:#ffffff25;color:white;border-radius:50%;width:45px;height:45px;display:grid;place-items:center;backdrop-filter:blur(8px)}
.action-btn svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}
.action-btn.liked{color:#ffb6b6}.action-btn.saved{color:#d8edc8}
.action-count{font-size:11px;color:white}
nav{position:fixed;bottom:0;left:0;right:0;height:75px;z-index:20;background:#fffdf7;border-top:1px solid #e6eae4;display:flex;justify-content:space-around;align-items:center;padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:#788579;min-width:55px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;padding:5px 2px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--d);font-weight:800}
.plus{display:grid;place-items:center;width:38px;height:34px;border-radius:11px;background:var(--g);color:white;font-size:26px}
.section{padding:22px 17px}
.section h2{font-size:22px;margin:4px 0 18px}
.sub{font-size:13px;color:#829083;margin-top:-10px;margin-bottom:20px}
.card{background:white;border:1px solid #e9eee7;border-radius:17px;padding:15px;margin-bottom:13px;box-shadow:0 3px 12px #263c2510}
.card h3{margin:0 0 7px;font-size:16px}
.card p{margin:4px 0;color:#788579;font-size:13px}
.primary{border:0;border-radius:13px;background:var(--g);color:white;padding:13px 17px;font-weight:700}
.secondary{border:1px solid #dce5d9;border-radius:12px;background:white;color:var(--d);padding:10px 13px}
.danger{color:#b34b4b;border-color:#edcccc}
input,textarea{width:100%;border:1px solid #dce5d9;border-radius:12px;padding:13px;background:white;color:var(--text);margin:6px 0 14px;outline-color:var(--g)}
textarea{min-height:95px;resize:vertical}
label{font-size:13px;font-weight:700}
.preview{width:100%;max-height:280px;object-fit:contain;background:#edf1eb;border-radius:14px;margin:8px 0}
.empty{text-align:center;color:#849184;padding:45px 15px;line-height:1.8}
.profile-top{text-align:center;padding:28px 10px}
.avatar{width:78px;height:78px;border-radius:50%;background:var(--p);display:grid;place-items:center;margin:0 auto 12px;font-size:30px;color:var(--g);font-weight:800}
.stat-row{display:flex;justify-content:space-around;text-align:center;padding:15px}
.stat strong{display:block;font-size:20px;color:var(--d)}
.stat span{font-size:12px;color:#879286}
.small{font-size:12px;padding:8px 11px}
.modal-bg{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--cream);width:100%;max-width:400px;border-radius:20px;padding:20px;max-height:80vh;overflow:auto}
.modal h3{margin-top:0}
.modal-actions{display:flex;gap:9px;justify-content:flex-end}
.comment{padding:9px 0;border-bottom:1px solid #e8eee6;font-size:14px;overflow-wrap:anywhere}
.saved-img{width:100%;max-height:190px;object-fit:cover;border-radius:12px}
.post-delete{margin-top:9px;background:#0005;color:white;border:1px solid #ffffff88;border-radius:9px;padding:6px 10px;font-size:11px}
.status{font-size:12px;color:#788579;line-height:1.6}
@media(min-width:700px){body{max-width:480px;margin:auto;border-left:1px solid #eee;border-right:1px solid #eee}header,nav{max-width:480px;margin:auto}}
</style>
</head>
<body>
<header><div class="logo">Momeli</div><div class="header-label">travel memories</div></header>
<main>
<section id="feedPage" class="page active"><div id="feed"></div></section>

<section id="tripsPage" class="page">
<div class="section">
<h2>旅行</h2><p class="sub">行きたい場所や旅行の予定をまとめよう。</p>
<div class="card">
<h3>新しい旅行を作成</h3>
<label>旅行の名前</label><input id="tripName" placeholder="例：沖縄旅行">
<label>日付</label><input id="tripDate" type="date">
<button class="primary" onclick="addTrip()">旅行を作成</button>
</div>
<div id="tripList"></div>
</div>
</section>

<section id="createPage" class="page">
<div class="section">
<h2>投稿を作成</h2><p class="sub">旅先で見つけた景色や思い出を共有しよう。</p>
<div class="card">
<label>写真・動画</label>
<input id="mediaFile" type="file" accept="image/*,video/*" onchange="previewMedia(event)">
<div id="mediaPreview"></div>
<label>場所</label><input id="postPlace" placeholder="例：京都・嵐山">
<label>タイトル</label><input id="postTitle" maxlength="60" placeholder="投稿のタイトル">
<label>コメント</label><textarea id="postCaption" maxlength="1000" placeholder="おすすめポイントや旅の感想"></textarea>
<button class="primary" id="publishButton" style="width:100%" onclick="publish()">投稿する</button>
<p class="status" id="postStatus">写真は投稿時に自動圧縮して保存します。</p>
</div>
</div>
</section>

<section id="savedPage" class="page">
<div class="section"><h2>保存</h2><p class="sub">あとで見返したい投稿。</p><div id="savedList"></div></div>
</section>

<section id="profilePage" class="page">
<div class="section">
<div class="profile-top">
<div class="avatar" id="avatar">M</div>
<h2 id="profileName">マイページ</h2>
<p class="sub" id="profileBio">旅の思い出を残しましょう。</p>
<button class="secondary small" onclick="editProfile()">プロフィール編集</button>
</div>
<div class="card stat-row">
<div class="stat"><strong id="postCount">0</strong><span>投稿</span></div>
<div class="stat"><strong id="tripCount">0</strong><span>旅行</span></div>
<div class="stat"><strong id="savedCount">0</strong><span>保存</span></div>
</div>
<div class="card"><h3>データについて</h3><p>投稿と旅行はこのブラウザ内に保存されます。他のユーザーや端末とは共有されません。</p></div>
</div>
</section>
</main>

<nav>
<button class="active" onclick="showPage('feedPage',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m10 8 6 4-6 4z"/></svg><span>フィード</span></button>
<button onclick="showPage('tripsPage',this)"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM8 3v4m8-4v4M4 10h16"/></svg><span>旅行</span></button>
<button onclick="showPage('createPage',this)"><span class="plus">＋</span><span>投稿</span></button>
<button onclick="showPage('savedPage',this)"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg><span>保存</span></button>
<button onclick="showPage('profilePage',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg><span>マイページ</span></button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)hideModal()"><div class="modal" id="modal"></div></div>

<script>
"use strict";

const DB_NAME="MomeliCoreV3";
const STORE_POSTS="posts";
const STORE_TRIPS="trips";
let db,posts=[],trips=[],selectedFile=null;
let profile={name:"旅行好き",bio:"旅の思い出を記録しています。"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const samples=[
{id:"sample1",place:"長野・上高地",title:"自然に囲まれた最高の景色",caption:"空気が澄んでいて、ずっと歩いていたくなる場所。",image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000",likes:12,liked:false,saved:false,comments:[],sample:true},
{id:"sample2",place:"京都・嵐山",title:"京都でのんびり散歩",caption:"ゆっくり景色を楽しめるおすすめスポット。",image:"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=1000",likes:24,liked:false,saved:false,comments:[],sample:true},
{id:"sample3",place:"沖縄",title:"また行きたい海",caption:"ずっと眺めていたくなる景色。",image:"https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=1000",likes:31,liked:false,saved:false,comments:[],sample:true}
];

function openDB(){
return new Promise((resolve,reject)=>{
const req=indexedDB.open(DB_NAME,1);
req.onupgradeneeded=()=>{
const d=req.result;
if(!d.objectStoreNames.contains(STORE_POSTS))d.createObjectStore(STORE_POSTS,{keyPath:"id"});
if(!d.objectStoreNames.contains(STORE_TRIPS))d.createObjectStore(STORE_TRIPS,{keyPath:"id"});
};
req.onsuccess=()=>{db=req.result;resolve()};
req.onerror=()=>reject(req.error);
});
}

function readAll(store){
return new Promise((resolve,reject)=>{
const tx=db.transaction(store,"readonly");
const req=tx.objectStore(store).getAll();
req.onsuccess=()=>resolve(req.result||[]);
req.onerror=()=>reject(req.error);
});
}

function writeRecord(store,record){
return new Promise((resolve,reject)=>{
const tx=db.transaction(store,"readwrite");
tx.objectStore(store).put(record);
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error||new Error("保存エラー"));
tx.onabort=()=>reject(tx.error||new Error("保存が中断されました"));
});
}

function deleteRecord(store,id){
return new Promise((resolve,reject)=>{
const tx=db.transaction(store,"readwrite");
tx.objectStore(store).delete(id);
tx.oncomplete=resolve;
tx.onerror=()=>reject(tx.error);
});
}

async function savePost(p){await writeRecord(STORE_POSTS,p)}
async function saveTrip(t){await writeRecord(STORE_TRIPS,t)}

function showPage(id,btn){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
$(id).classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
btn?.classList.add("active");
if(id==="feedPage")renderFeed();
if(id==="tripsPage")renderTrips();
if(id==="savedPage")renderSaved();
if(id==="profilePage")renderStats();
}

const mediaURLs=new Map();
function media(p){
if(p.file instanceof Blob){
if(!mediaURLs.has(p.id))mediaURLs.set(p.id,URL.createObjectURL(p.file));
return mediaURLs.get(p.id);
}
return p.image||"";
}

function renderFeed(){
$("feed").innerHTML=posts.length?posts.map(p=>`
<article class="post" data-id="${esc(p.id)}">
${p.type==="video"?`<video class="post-media" src="${media(p)}" controls playsinline></video>`:`<img class="post-media" src="${media(p)}" alt="${esc(p.title)}">`}
<div class="post-info">
<div class="post-place">${esc(p.place)}</div>
<div class="post-title">${esc(p.title)}</div>
<div class="post-caption">${esc(p.caption)}</div>
${!p.sample?`<button class="post-delete" onclick="deletePost('${esc(p.id)}')">自分の投稿を削除</button>`:""}
</div>
<div class="post-actions">
<div class="action-item"><button class="action-btn ${p.liked?"liked":""}" onclick="likePost('${esc(p.id)}')">${heartIcon()}</button><span class="action-count">${p.likes||0}</span></div>
<div class="action-item"><button class="action-btn ${p.saved?"saved":""}" onclick="toggleSave('${esc(p.id)}')">${bookmarkIcon()}</button><span class="action-count">保存</span></div>
<div class="action-item"><button class="action-btn" onclick="commentPost('${esc(p.id)}')">${commentIcon()}</button><span class="action-count">${(p.comments||[]).length}</span></div>
<div class="action-item"><button class="action-btn" onclick="addPostToTrip('${esc(p.id)}')">${plusIcon()}</button><span class="action-count">旅行に追加</span></div>
</div></article>`).join(""):'<div class="empty">投稿はまだありません。<br>最初の思い出を投稿しましょう。</div>';
}

function heartIcon(){return '<svg viewBox="0 0 24 24"><path d="M20.8 8.7c0 5.2-8.8 10.3-8.8 10.3S3.2 13.9 3.2 8.7A4.7 4.7 0 0 1 12 6.3a4.7 4.7 0 0 1 8.8 2.4Z"/></svg>'}
function bookmarkIcon(){return '<svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>'}
function commentIcon(){return '<svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8 8.8 8.8 0 0 1-4-.9L4 20l1.3-3.6A8 8 0 1 1 20 11.5Z"/></svg>'}
function plusIcon(){return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>'}

function updateCard(id){
const p=posts.find(x=>x.id===id);
const card=document.querySelector(`.post[data-id="${CSS.escape(id)}"]`);
if(!p||!card)return;
const buttons=card.querySelectorAll(".action-btn");
buttons[0]?.classList.toggle("liked",!!p.liked);
buttons[1]?.classList.toggle("saved",!!p.saved);
card.querySelectorAll(".action-count")[0].textContent=p.likes||0;
card.querySelectorAll(".action-count")[2].textContent=(p.comments||[]).length;
}

async function likePost(id){
const p=posts.find(x=>x.id===id);if(!p)return;
const oldLiked=!!p.liked,oldLikes=p.likes||0;
p.liked=!oldLiked;p.likes=Math.max(0,oldLikes+(p.liked?1:-1));
updateCard(id);
try{await savePost(p)}catch(e){p.liked=oldLiked;p.likes=oldLikes;updateCard(id);showStorageError(e)}
}

async function toggleSave(id){
const p=posts.find(x=>x.id===id);if(!p)return;
const old=!!p.saved;p.saved=!old;
updateCard(id);
try{await savePost(p);renderSaved();renderStats()}
catch(e){p.saved=old;updateCard(id);showStorageError(e)}
}

function modal(html){$("modal").innerHTML=html;$("modalBg").classList.add("show")}
function hideModal(){$("modalBg").classList.remove("show")}

function commentPost(id){
const p=posts.find(x=>x.id===id);if(!p)return;
modal(`<h3>コメント</h3>
<div id="commentList">${(p.comments||[]).map(c=>`<div class="comment">${esc(c)}</div>`).join("")||'<p class="sub">コメントはまだありません。</p>'}</div>
<textarea id="commentInput" maxlength="300" placeholder="コメントを入力"></textarea>
<div class="modal-actions"><button class="secondary" onclick="hideModal()">閉じる</button><button class="primary" onclick="sendComment('${esc(id)}')">送信</button></div>`);
}

async function sendComment(id){
const p=posts.find(x=>x.id===id),v=$("commentInput")?.value.trim();
if(!p||!v)return;
p.comments=p.comments||[];
p.comments.push(v);
try{await savePost(p);hideModal();updateCard(id)}
catch(e){p.comments.pop();showStorageError(e)}
}

function addPostToTrip(id){
if(!trips.length){alert("先に旅行を作成してください。");return}
modal(`<h3>旅行に追加</h3>${trips.map(t=>`<button class="secondary" style="width:100%;margin:5px 0" onclick="attachPost('${esc(id)}','${esc(t.id)}')">${esc(t.name)}</button>`).join("")}<button class="secondary" style="width:100%;margin-top:8px" onclick="hideModal()">閉じる</button>`);
}

async function attachPost(pid,tid){
const t=trips.find(x=>x.id===tid);if(!t)return;
t.posts=t.posts||[];
if(!t.posts.includes(pid))t.posts.push(pid);
try{await saveTrip(t);hideModal();renderTrips();alert("旅行に追加しました。")}
catch(e){t.posts=t.posts.filter(x=>x!==pid);showStorageError(e)}
}

function previewMedia(e){
selectedFile=e.target.files?.[0]||null;
const box=$("mediaPreview");
if(!selectedFile){box.innerHTML="";return}
const url=URL.createObjectURL(selectedFile);
box.innerHTML=selectedFile.type.startsWith("video/")
?`<video class="preview" src="${url}" controls playsinline></video>`
:`<img class="preview" src="${url}" alt="投稿プレビュー">`;
}

function compressImage(file){
return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onerror=()=>reject(new Error("画像を読み込めませんでした。"));
reader.onload=()=>{
const img=new Image();
img.onerror=()=>reject(new Error("この画像形式は読み込めません。JPEGまたはPNGをお試しください。"));
img.onload=()=>{
const max=1280;
const scale=Math.min(1,max/Math.max(img.width,img.height));
const canvas=document.createElement("canvas");
canvas.width=Math.max(1,Math.round(img.width*scale));
canvas.height=Math.max(1,Math.round(img.height*scale));
const ctx=canvas.getContext("2d");
if(!ctx){reject(new Error("画像の圧縮を開始できませんでした。"));return}
ctx.fillStyle="#ffffff";ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0,canvas.width,canvas.height);
canvas.toBlob(blob=>{
if(!blob){reject(new Error("画像の圧縮に失敗しました。"));return}
resolve(blob);
},"image/jpeg",0.72);
};
img.src=reader.result;
};
reader.readAsDataURL(file);
});
}

async function publish(){
const file=selectedFile;
if(!file){alert("写真または動画を選択してください。");return}
const place=$("postPlace").value.trim();
const title=$("postTitle").value.trim();
const caption=$("postCaption").value.trim();
if(!place||!title){alert("場所とタイトルを入力してください。");return}

const video=file.type.startsWith("video/");
if(video&&file.size>10*1024*1024){
alert("動画は10MB以下にしてください。写真は自動圧縮されます。");return;
}
if(!video&&!file.type.startsWith("image/")){
alert("対応していないファイル形式です。");return;
}

const button=$("publishButton");
button.disabled=true;
button.textContent="投稿を準備中...";
$("postStatus").textContent="写真を圧縮して保存しています。画面を閉じずにお待ちください。";

let post;
try{
let mediaBlob=file;
if(!video)mediaBlob=await compressImage(file);

post={
id:"post_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
place,title,caption,
file:mediaBlob,
type:video?"video":"image",
likes:0,liked:false,saved:false,comments:[],
createdAt:Date.now()
};

await savePost(post);
posts.unshift(post);
selectedFile=null;
$("mediaFile").value="";
$("mediaPreview").innerHTML="";
$("postPlace").value="";
$("postTitle").value="";
$("postCaption").value="";
$("postStatus").textContent="投稿できました。";
renderFeed();renderStats();
showPage("feedPage",document.querySelector("nav button"));
alert("投稿できました！");
}catch(e){
console.error(e);
$("postStatus").textContent="投稿に失敗しました。入力内容は残しています。";
showStorageError(e);
}finally{
button.disabled=false;
button.textContent="投稿する";
}
}

function showStorageError(e){
if(e?.name==="QuotaExceededError"||e?.name==="NS_ERROR_DOM_QUOTA_REACHED"){
alert("端末の保存容量が不足しています。写真を圧縮しても保存できない状態です。端末の空き容量を確保してから、もう一度お試しください。");
}else{
alert("保存できませんでした。\n"+(e?.message||"ブラウザの保存機能を確認してください。"));
}
}

async function deletePost(id){
const p=posts.find(x=>x.id===id);
if(!p||p.sample)return;
if(!confirm("この投稿を削除しますか？"))return;
try{
await deleteRecord(STORE_POSTS,id);
posts=posts.filter(x=>x.id!==id);
for(const t of trips){t.posts=(t.posts||[]).filter(x=>x!==id);await saveTrip(t)}
if(mediaURLs.has(id)){URL.revokeObjectURL(mediaURLs.get(id));mediaURLs.delete(id)}
renderFeed();renderSaved();renderStats();renderTrips();
}catch(e){showStorageError(e)}
}

async function addTrip(){
const name=$("tripName").value.trim();
if(!name){alert("旅行の名前を入力してください。");return}
const t={id:"trip_"+Date.now(),name,date:$("tripDate").value,posts:[],memo:"",places:[]};
try{await saveTrip(t);trips.push(t);$("tripName").value="";$("tripDate").value="";renderTrips();renderStats()}
catch(e){showStorageError(e)}
}

function renderTrips(){
$("tripList").innerHTML=trips.length?trips.map(t=>`
<div class="card">
<h3>${esc(t.name)}</h3>
<p>${esc(t.date||"日程未定")} ・ ${(t.posts||[]).length}件の投稿</p>
<button class="secondary small" onclick="tripDetail('${esc(t.id)}')">詳細</button>
<button class="secondary danger small" onclick="deleteTrip('${esc(t.id)}')">削除</button>
</div>`).join(""):'<div class="empty">旅行はまだありません。</div>';
}

function tripDetail(id){
const t=trips.find(x=>x.id===id);if(!t)return;
const related=posts.filter(p=>(t.posts||[]).includes(p.id));
modal(`<h3>${esc(t.name)}</h3><p>${esc(t.date||"日程未定")}</p>
<label>行きたい場所（改行で区切る）</label>
<textarea id="tripPlaces">${esc((t.places||[]).join("\n"))}</textarea>
<label>メモ</label><textarea id="tripMemo">${esc(t.memo||"")}</textarea>
<p>追加した投稿：${related.length}件</p>
${related.map(p=>`<div class="comment">${esc(p.title)} ・ ${esc(p.place)}</div>`).join("")}
<div class="modal-actions"><button class="secondary" onclick="hideModal()">閉じる</button><button class="primary" onclick="saveTripDetail('${esc(id)}')">保存</button></div>`);
}

async function saveTripDetail(id){
const t=trips.find(x=>x.id===id);if(!t)return;
t.places=$("tripPlaces").value.split("\n").map(x=>x.trim()).filter(Boolean);
t.memo=$("tripMemo").value.trim();
try{await saveTrip(t);hideModal();renderTrips()}
catch(e){showStorageError(e)}
}

async function deleteTrip(id){
if(!confirm("この旅行を削除しますか？"))return;
try{await deleteRecord(STORE_TRIPS,id);trips=trips.filter(t=>t.id!==id);renderTrips();renderStats()}
catch(e){showStorageError(e)}
}

function renderSaved(){
const list=posts.filter(p=>p.saved);
$("savedList").innerHTML=list.length?list.map(p=>`
<div class="card">
${p.type==="video"?`<video class="saved-img" src="${media(p)}" controls playsinline></video>`:`<img class="saved-img" src="${media(p)}" alt="${esc(p.title)}">`}
<h3>${esc(p.title)}</h3><p>${esc(p.place)}</p>
<button class="secondary small" onclick="toggleSave('${esc(p.id)}')">保存を解除</button>
</div>`).join(""):'<div class="empty">保存した投稿はありません。</div>';
}

function renderStats(){
$("postCount").textContent=posts.filter(p=>!p.sample).length;
$("tripCount").textContent=trips.length;
$("savedCount").textContent=posts.filter(p=>p.saved).length;
}

function editProfile(){
modal(`<h3>プロフィール編集</h3><label>名前</label><input id="editName" maxlength="24" value="${esc(profile.name)}"><label>自己紹介</label><textarea id="editBio" maxlength="120">${esc(profile.bio)}</textarea><div class="modal-actions"><button class="secondary" onclick="hideModal()">キャンセル</button><button class="primary" onclick="saveProfile()">保存</button></div>`);
}
function saveProfile(){
const name=$("editName").value.trim();if(!name){alert("名前を入力してください。");return}
profile={name,bio:$("editBio").value.trim()};
try{localStorage.setItem("momeliProfile",JSON.stringify(profile))}catch(e){}
$("profileName").textContent=profile.name;
$("profileBio").textContent=profile.bio;
$("avatar").textContent=profile.name.slice(0,1);
hideModal();
}

async function start(){
try{
profile=JSON.parse(localStorage.getItem("momeliProfile"))||profile;
}catch(e){}
$("profileName").textContent=profile.name;
$("profileBio").textContent=profile.bio;
$("avatar").textContent=profile.name.slice(0,1);
try{
await openDB();
posts=await readAll(STORE_POSTS);
trips=await readAll(STORE_TRIPS);
if(!posts.length)posts=samples.map(p=>({...p}));
}catch(e){
console.error("Database error:",e);
$("feed").innerHTML='<div class="empty">保存機能を開始できませんでした。ブラウザの設定をご確認ください。</div>';
return;
}
renderFeed();renderTrips();renderSaved();renderStats();
}
start();
</script>
</body>
</html>
