
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#78977B">
<title>Momeli</title>

<style>
:root{
  --green:#78977B;
  --dark:#405C45;
  --pale:#E8F0E5;
  --cream:#FFFDF7;
  --text:#28352B;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--cream);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

header{
  position:fixed;
  top:0;left:0;right:0;
  height:55px;
  z-index:20;
  background:#fffdf7ed;
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #e7ebe5;
}
.logo{
  font-size:23px;
  font-weight:800;
  color:var(--green);
  letter-spacing:1px;
}
.header-label{font-size:12px;color:#788579}

main{
  padding-top:55px;
  padding-bottom:80px;
  min-height:100vh;
}
.page{display:none;min-height:calc(100vh - 135px)}
.page.active{display:block}

#feedPage{
  height:calc(100dvh - 135px);
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}
.post{
  height:calc(100dvh - 135px);
  min-height:480px;
  position:relative;
  scroll-snap-align:start;
  overflow:hidden;
  background:#dce5d9;
  color:white;
}
.post-media{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.post:after{
  content:"";
  position:absolute;
  inset:35% 0 0;
  background:linear-gradient(transparent,#0009);
  pointer-events:none;
}
.post-info{
  position:absolute;
  z-index:2;
  bottom:22px;
  left:17px;
  right:78px;
  text-shadow:0 1px 5px #0008;
}
.post-place{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}
.post-title{
  font-size:21px;
  font-weight:800;
  margin-bottom:8px;
}
.post-caption{
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.post-actions{
  position:absolute;
  right:13px;
  bottom:35px;
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:19px;
  align-items:center;
}
.action-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}
.action-btn{
  border:0;
  background:#ffffff25;
  color:white;
  border-radius:50%;
  width:45px;
  height:45px;
  display:grid;
  place-items:center;
  backdrop-filter:blur(8px);
}
.action-btn svg{
  width:25px;
  height:25px;
}
.action-btn.liked{color:#ffb6b6}
.action-btn.saved{color:#d8edc8}
.action-count{font-size:11px;color:white}

nav{
  position:fixed;
  bottom:0;left:0;right:0;
  height:75px;
  z-index:30;
  background:#fffdf7;
  border-top:1px solid #e6eae4;
  display:flex;
  justify-content:space-around;
  align-items:center;
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  border:0;
  background:none;
  color:#788579;
  min-width:55px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  padding:5px 2px;
}
nav button svg{
  width:24px;
  height:24px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
nav button.active{
  color:var(--dark);
  font-weight:800;
}
nav .create-tab .plus-icon{
  display:grid;
  place-items:center;
  width:38px;
  height:34px;
  border-radius:11px;
  background:var(--green);
  color:white;
  font-size:26px;
  line-height:1;
}

.section{padding:22px 17px}
.section h2{font-size:22px;margin:4px 0 18px}
.sub{
  font-size:13px;
  color:#829083;
  margin-top:-10px;
  margin-bottom:20px;
}
.card{
  background:white;
  border:1px solid #e9eee7;
  border-radius:17px;
  padding:15px;
  margin-bottom:13px;
  box-shadow:0 3px 12px #263c2510;
}
.card h3{margin:0 0 7px;font-size:16px}
.card p{margin:4px 0;color:#788579;font-size:13px}
.primary{
  border:0;
  border-radius:13px;
  background:var(--green);
  color:white;
  padding:13px 17px;
  font-weight:700;
}
.secondary{
  border:1px solid #dce5d9;
  border-radius:12px;
  background:white;
  color:var(--dark);
  padding:10px 13px;
}
.danger{color:#b34b4b;border-color:#edcccc}
input,textarea{
  width:100%;
  border:1px solid #dce5d9;
  border-radius:12px;
  padding:13px;
  background:white;
  color:var(--text);
  margin:6px 0 14px;
  outline-color:var(--green);
}
textarea{min-height:95px;resize:vertical}
label{font-size:13px;font-weight:700}
.form-group{margin-bottom:8px}
.preview{
  width:100%;
  max-height:280px;
  object-fit:contain;
  background:#edf1eb;
  border-radius:14px;
  margin:8px 0;
}
.empty{
  text-align:center;
  color:#849184;
  padding:45px 15px;
  line-height:1.8;
}
.profile-top{text-align:center;padding:28px 10px}
.avatar{
  width:78px;height:78px;
  border-radius:50%;
  background:var(--pale);
  display:grid;
  place-items:center;
  margin:0 auto 12px;
}
.avatar svg{width:36px;height:36px;stroke:var(--green)}
.stat-row{display:flex;justify-content:space-around;text-align:center;padding:15px}
.stat strong{display:block;font-size:20px;color:var(--dark)}
.stat span{font-size:12px;color:#879286}
.small-btn{font-size:12px;padding:8px 11px}

.modal-bg{
  display:none;
  position:fixed;
  inset:0;
  background:#0007;
  z-index:60;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-bg.show{display:flex}
.modal{
  background:var(--cream);
  width:100%;
  max-width:400px;
  border-radius:20px;
  padding:20px;
  max-height:80vh;
  overflow:auto;
}
.modal h3{margin-top:0}
.modal-actions{
  display:flex;
  gap:9px;
  justify-content:flex-end;
}
.comment{
  padding:9px 0;
  border-bottom:1px solid #e8eee6;
  font-size:14px;
  overflow-wrap:anywhere;
}
.comment-form{margin-top:12px}

@media(min-width:700px){
  body{
    max-width:480px;
    margin:auto;
    border-left:1px solid #eee;
    border-right:1px solid #eee;
  }
  header,nav{max-width:480px;margin:auto}
}
</style>
</head>

<body>

<header>
  <div class="logo">Momeli</div>
  <div class="header-label">travel memories</div>
</header>

<main>

<section id="feedPage" class="page active">
  <div id="feed"></div>
</section>

<section id="tripsPage" class="page">
  <div class="section">
    <h2>旅行</h2>
    <p class="sub">行きたい場所や旅行の予定をまとめましょう。</p>

    <div class="card">
      <h3>新しい旅行を作成</h3>
      <label>旅行の名前</label>
      <input id="tripName" placeholder="例：沖縄旅行">
      <label>日付</label>
      <input id="tripDate" type="date">
      <button class="primary" onclick="addTrip()">旅行を作成</button>
    </div>

    <div id="tripList"></div>
  </div>
</section>

<section id="createPage" class="page">
  <div class="section">
    <h2>投稿を作成</h2>
    <p class="sub">旅先で見つけた景色や思い出を共有しましょう。</p>

    <div class="card">
      <label>写真・動画</label>
      <input id="mediaFile" type="file" accept="image/*,video/*" onchange="previewMedia(event)">
      <div id="mediaPreview"></div>

      <label>場所</label>
      <input id="postPlace" placeholder="例：京都・嵐山">

      <label>タイトル</label>
      <input id="postTitle" placeholder="投稿のタイトル">

      <label>コメント</label>
      <textarea id="postCaption" placeholder="おすすめポイントや旅の感想"></textarea>

      <button class="primary" style="width:100%" onclick="publish()">投稿する</button>
      <p style="font-size:11px">投稿はこの端末のブラウザ内に保存される試作版です。</p>
    </div>
  </div>
</section>

<section id="savedPage" class="page">
  <div class="section">
    <h2>保存</h2>
    <p class="sub">あとで見返したい投稿を集めましょう。</p>
    <div id="savedList"></div>
  </div>
</section>

<section id="profilePage" class="page">
  <div class="section">
    <div class="profile-top">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/>
        </svg>
      </div>
      <h2 style="margin:0">マイページ</h2>
      <p class="sub" style="margin:7px 0">旅の思い出を残しましょう。</p>
    </div>

    <div class="card stat-row">
      <div class="stat"><strong id="postCount">0</strong><span>投稿</span></div>
      <div class="stat"><strong id="tripCount">0</strong><span>旅行</span></div>
      <div class="stat"><strong id="savedCount">0</strong><span>保存</span></div>
    </div>

    <div class="card">
      <h3>Momeliについて</h3>
      <p>旅先を見つけて、計画して、思い出を残す。</p>
      <p>Momeli - Your travel memories.</p>
    </div>

    <div class="card">
      <h3>データについて</h3>
      <p>現在の投稿・旅行は、このブラウザ内に保存されます。他のユーザーとは共有されません。</p>
      <button class="secondary danger small-btn" onclick="resetData()">データを初期化</button>
    </div>
  </div>
</section>

</main>

<nav>
  <button class="active" onclick="showPage('feedPage',this)">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <path d="m10 8 6 4-6 4z"/>
    </svg>
    <span>フィード</span>
  </button>

  <button onclick="showPage('tripsPage',this)">
    <svg viewBox="0 0 24 24">
      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
      <circle cx="12" cy="10" r="2.5"/>
    </svg>
    <span>旅行</span>
  </button>

  <button class="create-tab" onclick="showPage('createPage',this)">
    <span class="plus-icon">＋</span>
    <span>投稿</span>
  </button>

  <button onclick="showPage('savedPage',this)">
    <svg viewBox="0 0 24 24">
      <path d="M6 4h12v17l-6-4-6 4z"/>
    </svg>
    <span>保存</span>
  </button>

  <button onclick="showPage('profilePage',this)">
    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/>
    </svg>
    <span>マイページ</span>
  </button>
</nav>

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
let posts=[];
let trips=[];
let selectedFile=null;
let db;

const icons={
 pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.8 8.7c0 5.2-8.8 10.3-8.8 10.3S3.2 13.9 3.2 8.7A4.7 4.7 0 0 1 12 6.3a4.7 4.7 0 0 1 8.8 2.4Z"/></svg>',
 bookmark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4-6 4z"/></svg>',
 comment:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11.5a8 8 0 0 1-8 8 8.8 8.8 0 0 1-4-.9L4 20l1.3-3.6A8 8 0 1 1 20 11.5Z"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>'
};

const starterPosts=[
 {id:"sample1",place:"長野・上高地",title:"自然に囲まれた最高の景色",caption:"空気が澄んでいて、ずっと歩いていたくなる場所。",image:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1000",likes:12,saved:false,liked:false,comments:[],sample:true},
 {id:"sample2",place:"京都・嵐山",title:"京都でのんびり散歩",caption:"ゆっくり景色を楽しめるおすすめスポット。",image:"https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=1000",likes:24,saved:false,liked:false,comments:[],sample:true},
 {id:"sample3",place:"沖縄",title:"海がきれいな場所",caption:"また行きたいと思える景色。",image:"https://images.unsplash.com/photo-1510414842594-a61c69b5ae57?w=1000",likes:31,saved:false,liked:false,comments:[],sample:true}
];

function openDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open("momeliDB",2);
  request.onupgradeneeded=()=>{
   const d=request.result;
   if(!d.objectStoreNames.contains("data"))d.createObjectStore("data");
  };
  request.onsuccess=()=>{db=request.result;resolve(db)};
  request.onerror=()=>reject(request.error);
 });
}

async function saveData(){
 if(!db)return;
 return new Promise((resolve,reject)=>{
  const tx=db.transaction("data","readwrite");
  tx.objectStore("data").put({posts,trips},"main");
  tx.oncomplete=resolve;
  tx.onerror=()=>reject(tx.error);
 });
}

async function loadData(){
 await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction("data","readonly");
  const req=tx.objectStore("data").get("main");
  req.onsuccess=()=>{
   if(req.result){
    posts=req.result.posts||[];
    trips=req.result.trips||[];
   }else{
    posts=starterPosts.map(p=>({...p}));
    trips=[];
   }
   resolve();
  };
  req.onerror=()=>reject(req.error);
 });
}

function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function showPage(id,button){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");

 if(id==="feedPage")renderFeed();
 if(id==="savedPage")renderSaved();
 if(id==="tripsPage")renderTrips();
}

function mediaURL(p){
 if(p.file instanceof Blob)return URL.createObjectURL(p.file);
 return p.image||"";
}

function renderFeed(){
 const feed=document.getElementById("feed");

 if(!posts.length){
  feed.innerHTML='<div class="empty">まだ投稿はありません。<br>最初の旅の思い出を投稿しましょう。</div>';
  return;
 }

 feed.innerHTML=posts.map(p=>{
  const src=mediaURL(p);
  return `<article class="post">
   ${p.type==="video"
    ?`<video class="post-media" src="${src}" controls playsinline></video>`
    :`<img class="post-media" src="${src}" alt="旅行の投稿">`}
   <div class="post-info">
    <div class="post-place">${icons.pin}<span>${safe(p.place)}</span></div>
    <div class="post-title">${safe(p.title)}</div>
    <div class="post-caption">${safe(p.caption)}</div>
   </div>
   <div class="post-actions">
    <div class="action-item">
     <button class="action-btn ${p.liked?"liked":""}" onclick="likePost('${p.id}')">${icons.heart}</button>
     <span class="action-count">${p.likes||0}</span>
    </div>
    <div class="action-item">
     <button class="action-btn ${p.saved?"saved":""}" onclick="toggleSave('${p.id}')">${icons.bookmark}</button>
     <span class="action-count">保存</span>
    </div>
    <div class="action-item">
     <button class="action-btn" onclick="commentPost('${p.id}')">${icons.comment}</button>
     <span class="action-count">${(p.comments||[]).length}</span>
    </div>
    <div class="action-item">
     <button class="action-btn" onclick="addPostToTrip('${p.id}')">${icons.plus}</button>
     <span class="action-count">旅行に追加</span>
    </div>
   </div>
  </article>`;
 }).join("");
}

async function likePost(id){
 const p=posts.find(x=>x.id===id);
 if(!p)return;
 p.liked=!p.liked;
 p.likes=Math.max(0,(p.likes||0)+(p.liked?1:-1));
 await saveData();
 renderFeed();
}

async function toggleSave(id){
 const p=posts.find(x=>x.id===id);
 if(!p)return;
 p.saved=!p.saved;
 await saveData();
 renderFeed();
 renderSaved();
 renderStats();
}

function commentPost(id){
 const p=posts.find(x=>x.id===id);
 if(!p)return;

 openModal(`
  <h3>コメント</h3>
  <div id="comments">
   ${(p.comments||[]).map(c=>`<div class="comment">${safe(c)}</div>`).join("")||'<p class="sub">まだコメントはありません。</p>'}
  </div>
  <div class="comment-form">
   <textarea id="commentInput" placeholder="コメントを入力"></textarea>
  </div>
  <div class="modal-actions">
   <button class="secondary" onclick="hideModal()">閉じる</button>
   <button class="primary" onclick="sendComment('${id}')">送信</button>
  </div>
 `);
}

async function sendComment(id){
 const p=posts.find(x=>x.id===id);
 const value=document.getElementById("commentInput").value.trim();
 if(!value)return;

 p.comments=p.comments||[];
 p.comments.push(value);
 await saveData();
 hideModal();
 renderFeed();
}

function addPostToTrip(id){
 if(!trips.length){
  alert("先に旅行を作成してください。");
  return;
 }

 openModal(`
  <h3>旅行に追加</h3>
  ${trips.map(t=>`
   <button class="secondary" style="width:100%;margin:5px 0"
    onclick="attachPost('${id}','${t.id}')">${safe(t.name)}</button>
  `).join("")}
  <button class="secondary" style="width:100%;margin-top:10px" onclick="hideModal()">閉じる</button>
 `);
}

async function attachPost(postId,tripId){
 const t=trips.find(x=>x.id===tripId);
 if(t&&!t.posts.includes(postId))t.posts.push(postId);
 await saveData();
 hideModal();
 alert("旅行に追加しました。");
}

function previewMedia(event){
 selectedFile=event.target.files[0]||null;
 const box=document.getElementById("mediaPreview");
 if(!selectedFile){box.innerHTML="";return}

 const url=URL.createObjectURL(selectedFile);
 box.innerHTML=selectedFile.type.startsWith("video/")
  ?`<video class="preview" src="${url}" controls></video>`
  :`<img class="preview" src="${url}" alt="投稿プレビュー">`;
}

async function publish(){
 if(!selectedFile){
  alert("写真または動画を選択してください。");
  return;
 }

 const place=document.getElementById("postPlace").value.trim();
 const title=document.getElementById("postTitle").value.trim();
 const caption=document.getElementById("postCaption").value.trim();

 if(!place||!title){
  alert("場所とタイトルを入力してください。");
  return;
 }

 if(selectedFile.size>40*1024*1024){
  alert("ファイルサイズは40MB以下にしてください。");
  return;
 }

 const post={
  id:"post_"+Date.now(),
  place,title,caption,
  file:selectedFile,
  type:selectedFile.type.startsWith("video/")?"video":"image",
  likes:0,saved:false,liked:false,comments:[]
 };

 posts.unshift(post);

 try{
  await saveData();
  selectedFile=null;
  document.getElementById("mediaFile").value="";
  document.getElementById("mediaPreview").innerHTML="";
  document.getElementById("postPlace").value="";
  document.getElementById("postTitle").value="";
  document.getElementById("postCaption").value="";

  renderFeed();
  renderStats();
  alert("投稿を保存しました。");
  document.querySelectorAll("nav button")[0].click();
 }catch(e){
  posts.shift();
  alert("保存できませんでした。端末の空き容量を確認してください。");
 }
}

async function addTrip(){
 const name=document.getElementById("tripName").value.trim();
 const date=document.getElementById("tripDate").value;

 if(!name){
  alert("旅行の名前を入力してください。");
  return;
 }

 trips.push({
  id:"trip_"+Date.now(),
  name,date,
  posts:[]
 });

 await saveData();
 document.getElementById("tripName").value="";
 document.getElementById("tripDate").value="";
 renderTrips();
 renderStats();
}

function renderTrips(){
 const box=document.getElementById("tripList");

 if(!trips.length){
  box.innerHTML='<div class="empty">まだ旅行はありません。<br>最初の旅行を作成しましょう。</div>';
  return;
 }

 box.innerHTML=trips.map(t=>`
  <div class="card">
   <h3>${safe(t.name)}</h3>
   <p>${safe(t.date||"日程未定")}</p>
   <p>追加した投稿：${t.posts.length}件</p>
   <button class="secondary small-btn" onclick="showTrip('${t.id}')">詳細を見る</button>
   <button class="secondary danger small-btn" onclick="deleteTrip('${t.id}')">削除</button>
  </div>
 `).join("");
}

function showTrip(id){
 const t=trips.find(x=>x.id===id);
 if(!t)return;

 const attached=posts.filter(p=>t.posts.includes(p.id));

 openModal(`
  <h3>${safe(t.name)}</h3>
  <p class="sub">${safe(t.date||"日程未定")}</p>
  ${attached.map(p=>`
   <div class="card">
    <b>${safe(p.title)}</b>
    <p>${safe(p.place)}</p>
   </div>
  `).join("")||"<p>まだ投稿は追加されていません。</p>"}
  <button class="secondary" onclick="hideModal()">閉じる</button>
 `);
}

async function deleteTrip(id){
 if(!confirm("この旅行を削除しますか？"))return;
 trips=trips.filter(t=>t.id!==id);
 await saveData();
 renderTrips();
 renderStats();
}

function renderSaved(){
 const box=document.getElementById("savedList");
 const saved=posts.filter(p=>p.saved);

 if(!saved.length){
  box.innerHTML='<div class="empty">保存した投稿はまだありません。<br>気になる投稿を保存しましょう。</div>';
  return;
 }

 box.innerHTML=saved.map(p=>`
  <div class="card">
   <h3>${safe(p.title)}</h3>
   <p>${icons.pin} ${safe(p.place)}</p>
   <button class="secondary small-btn" onclick="unsave('${p.id}')">保存を解除</button>
  </div>
 `).join("");
}

async function unsave(id){
 const p=posts.find(x=>x.id===id);
 if(p)p.saved=false;
 await saveData();
 renderSaved();
 renderStats();
 renderFeed();
}

function renderStats(){
 document.getElementById("postCount").textContent=posts.filter(p=>!p.sample).length;
 document.getElementById("tripCount").textContent=trips.length;
 document.getElementById("savedCount").textContent=posts.filter(p=>p.saved).length;
}

function openModal(html){
 document.getElementById("modal").innerHTML=html;
 document.getElementById("modalBg").classList.add("show");
}
function hideModal(){
 document.getElementById("modalBg").classList.remove("show");
}
function closeModal(e){
 if(e.target.id==="modalBg")hideModal();
}

async function resetData(){
 if(!confirm("投稿・旅行のデータを初期化しますか？"))return;
 posts=starterPosts.map(p=>({...p,comments:[]}));
 trips=[];
 await saveData();
 renderFeed();
 renderTrips();
 renderSaved();
 renderStats();
 alert("初期化しました。");
}

async function start(){
 try{
  await loadData();
 }catch(e){
  posts=starterPosts.map(p=>({...p}));
  trips=[];
 }
 renderFeed();
 renderTrips();
 renderSaved();
 renderStats();
}

start();
</script>

</body>
</html>
